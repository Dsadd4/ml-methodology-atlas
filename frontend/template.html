<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研究方法论图谱 · Methodology Atlas</title><style>
:root{--ink:#182d3b;--blue:#3965bb;--line:#dce3e9;--paper:#f6f8fb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}button,input,select{font:inherit;color:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer}a{color:#244d97;text-decoration:none}a:hover{text-decoration:underline}aside{position:fixed;inset:0 auto 0 0;width:234px;padding:32px 20px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{font-size:20px;font-weight:750;letter-spacing:-.5px}.brand b{display:inline-grid;place-items:center;background:#244d79;color:white;border-radius:12px;width:35px;height:35px;margin-right:8px}.eyebrow{font-size:11px;letter-spacing:2px;color:#274d76;font-weight:700}.aside-note{font-size:12px;margin:8px 0 30px}nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:12px 16px;border-radius:9px;margin:5px 0}nav button.active{background:#eaf0fc;color:#244d97;font-weight:700}.side-bottom{margin-top:auto;font-size:12px;padding:20px 10px;border-top:1px solid var(--line)}main{margin-left:234px;padding:42px 48px;max-width:1700px}.topline{display:flex;justify-content:space-between;align-items:center}.badge{display:inline-block;border-radius:6px;background:#edf2f8;padding:3px 8px;font-size:11px;font-weight:600}.hero{display:flex;justify-content:space-between;gap:30px;align-items:center;margin:25px 0}h1{font-size:38px;letter-spacing:-1.5px;line-height:1.3;margin:10px 0 16px}h2{font-size:23px;line-height:1.5}h3{font-size:18px;line-height:1.5;margin:10px 0}p{margin:10px 0}.intro{max-width:660px;font-size:15px}.stats{display:flex;gap:27px}.stat strong{font-size:33px;display:block;line-height:1.3}.stat span{font-size:12px;white-space:nowrap}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 16px}.search{flex:1;min-width:230px;border:1px solid var(--line);border-radius:10px;padding:11px 15px;background:white}select,.plain{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 12px}.groups{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:22px 0}.group{border:1px solid var(--line);background:white;border-radius:12px;text-align:left;padding:15px 10px;border-top:4px solid var(--c)}.group.active{outline:2px solid var(--c);outline-offset:1px}.group strong{display:block;font-size:13px}.group small{font-size:11px}.sectionline{display:flex;justify-content:space-between;align-items:center;margin:25px 0 14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:23px;position:relative;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;min-height:260px;border-top:3px solid var(--c)}.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px #1b375514}.card-head{display:flex;justify-content:space-between;align-items:center;font-size:11px}.card-title{border:0;background:none;padding:0;text-align:left;font-weight:700;font-size:18px;line-height:1.5;margin:13px 0 8px}.card p{font-size:13px;margin:0 0 14px}.formula{background:#f3f6fa;border-radius:8px;padding:11px 12px;font:14px/1.8 'Times New Roman','PingFang SC',serif;overflow-wrap:anywhere;white-space:pre-wrap}.card footer{margin-top:auto;padding-top:16px;font-size:11px;display:flex;justify-content:space-between;align-items:center}.check{display:inline-flex;gap:5px;align-items:center}.empty{padding:65px;text-align:center;border:1px dashed #a2b4c8;border-radius:14px;grid-column:1/-1}.notice{border-left:3px solid #5aa69a;background:#ecf5f3;padding:12px 17px;border-radius:0 8px 8px 0;font-size:13px}.paper{background:white;border:1px solid var(--line);border-radius:12px;padding:23px;margin:12px 0}.paper h3{font-size:17px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.chip{border:1px solid #cbd9e7;background:#f2f6fb;border-radius:7px;font-size:12px;padding:4px 9px}.matrix{overflow:auto;background:white;border:1px solid var(--line);border-radius:14px;margin:25px 0}table{width:100%;border-collapse:collapse}th,td{padding:18px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:#edf2f8}td button{border:0;border-radius:8px;padding:8px 20px;background:#e3ecfa;font-weight:700}.compare-table{min-width:700px}.compare-table td{min-width:180px;max-width:340px;font-size:13px}.comparebar{position:fixed;bottom:25px;left:calc(50% + 100px);transform:translateX(-50%);background:#1c3652;color:white;border-radius:13px;padding:13px 22px;box-shadow:0 8px 30px #1235;display:flex;gap:20px;align-items:center;z-index:5}.comparebar button{background:white;border:0;padding:6px 15px;border-radius:7px}dialog{border:0;border-radius:18px;padding:0;width:min(900px,94vw);max-height:90vh;color:var(--ink);box-shadow:0 20px 80px #1234}dialog::backdrop{background:#132a4366;backdrop-filter:blur(4px)}.dialog-head{position:sticky;top:0;background:white;border-bottom:1px solid var(--line);padding:20px 30px;display:flex;justify-content:space-between;align-items:center;z-index:1}.dialog-body{padding:12px 32px 32px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:20px 0}.detail-box{padding:17px;background:#f3f6fa;border-radius:10px}.detail-box h3{font-size:13px;margin:0 0 6px}.detail-box p{font-size:14px}.close{background:#edf2f8;border:0;border-radius:8px;padding:7px 13px}.hidden{display:none!important}details{margin:15px 0}summary{cursor:pointer;font-weight:600}.footer-note{margin:35px 0 70px;font-size:12px}.count{font-size:12px} @media(max-width:1150px){main{padding:30px 25px}.grid{grid-template-columns:repeat(2,1fr)}.groups{grid-template-columns:repeat(3,1fr)}.hero{display:block}.stats{margin-top:22px}}@media(max-width:720px){aside{position:static;width:100%;padding:14px 18px}.brand{font-size:18px}.aside-note,.side-bottom{display:none}nav{display:flex;overflow:auto;margin-top:10px}nav button{white-space:nowrap;width:auto;padding:8px 12px;margin:0}main{margin:0;padding:22px 18px}h1{font-size:30px}.grid{grid-template-columns:1fr}.groups{grid-template-columns:repeat(2,1fr)}.stats{gap:25px}.stat strong{font-size:26px}.detail-grid{grid-template-columns:1fr}.comparebar{left:50%;width:92%;justify-content:space-between}.dialog-body{padding:15px 20px}.topline .badge{display:none}}@media print{aside,.toolbar,.groups,.comparebar,.close{display:none!important}main{margin:0;padding:0}.grid{grid-template-columns:repeat(2,1fr)}.card{break-inside:avoid}dialog{position:static;max-height:none;width:100%}}
</style></head><body><aside><div class="brand"><b>∑</b>方法论图谱</div><div class="aside-note">ML METHODOLOGY ATLAS<br>从数学直觉，到研究中的用法</div><nav aria-label="主要导航"><button data-view="methods" class="active">◈　探索方法</button><button data-view="papers">▤　Oral 文献库</button><button data-view="coverage">▦　会议覆盖</button><button data-view="compare">⇄　方法对比</button></nav><div class="side-bottom">独立研究资料库 · 第一版<br>2022—2026 · 六个顶会<br><br><a href="../README.md">项目说明 ↗</a><br><a href="../data/methods.csv" download>下载完整方法表 ↓</a></div></aside><main><div class="topline"><span class="eyebrow">RESEARCH TOOLKIT / 数学建模工具箱</span><span class="badge">更新于 2026.10.27 · 本地离线可用</span></div><header class="hero"><div><h1 id="heading">为研究问题，找到数学语言。</h1><p class="intro" id="intro">从 59 类方法论出发，理解它为什么成立、适用于什么问题，以及顶会论文如何使用它。</p></div><div class="stats"><div class="stat"><strong>59</strong><span>方法论框架</span></div><div class="stat"><strong>46</strong><span>已核 Oral 展示</span></div><div class="stat"><strong>24/25</strong><span>会议年份已取样</span></div></div></header><div id="controls"><div class="toolbar"><input id="search" class="search" placeholder="搜索方法、研究问题、公式或论文…" aria-label="搜索"><select id="origin" aria-label="方法来源"><option value="">全部方法来源</option><option value="original_30">原有 30 类</option><option value="foundation_extension">经典框架扩充</option><option value="oral_derived_extension">本轮 Oral 提炼</option></select><select id="evidence" aria-label="文献关联"><option value="">全部文献关联</option><option value="yes">有已核 Oral 关联</option><option value="no">暂未关联 Oral</option></select><select id="venue" class="hidden" aria-label="会议"><option value="">全部会议</option></select><select id="year" class="hidden" aria-label="年份"><option value="">全部年份</option></select><button class="plain" id="reset">重置</button></div><div id="groups" class="groups"></div></div><div id="content"></div><p class="footer-note">方法类别可以组合且存在包含关系。公式为教学模板；关联论文数不代表方法优劣。官方展示身份与正文阅读深度分别记录。</p></main><div id="comparebar" class="comparebar hidden"><span id="selected-count"></span><button id="open-compare">对比已选方法 →</button></div><dialog id="dialog"><div class="dialog-head"><span class="eyebrow" id="dialog-label"></span><button class="close" id="close-dialog" aria-label="关闭详情">关闭 ×</button></div><div class="dialog-body" id="detail"></div></dialog><script>
const DATA=__ATLAS_DATA__;
const methods=DATA.methods,papers=DATA.papers,groups=[...new Set(methods.map(m=>m.group))],colors=['#3965bb','#5aa69a','#b0a0d2','#da7c38','#cf8393','#7b387e'];
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let view='methods',group='',selected=new Set(); const originNames={original_30:'原有框架',foundation_extension:'经典扩充',oral_derived_extension:'Oral 提炼'};
function mapped(p,id){return [...p.method_mapping.primary,...p.method_mapping.secondary].includes(id)}
function linked(m){return papers.filter(p=>p.oral_status==='verified'&&mapped(p,m.id))}
function color(m){return colors[groups.indexOf(m.group)]}
function urlLink(url,label){return `<a target="_blank" rel="noopener" href="${esc(url)}">${esc(label)} ↗</a>`}
function depth(p){return p.reading_depth==='method_section'?'方法段已定位阅读':'摘要 / 介绍层筛选'}
function methodButton(id){let m=methods.find(m=>m.id===id);return `<button class="chip" data-method="${id}">${id} ${esc(m.name)}</button>`}
function paperHTML(p){let mp=p.method_mapping;return `<article class="paper"><div class="chips"><span class="badge">${p.venue} ${p.year}</span><span class="badge">${p.oral_status==='verified'?'官方 Oral 展示已核':'Oral 身份待核'}</span><span class="badge">${depth(p)}</span></div><h3>${esc(p.title)}</h3><p>${esc(p.intuition)}</p><div class="chips">${[...mp.primary,...mp.secondary].map(methodButton).join('')||'<span class="badge">暂未映射</span>'}${mp.relation==='related'?'<span class="badge">仅相关联系</span>':''}</div><details><summary>展开数学机制与证据</summary><div class="formula">${esc(p.formulation)}</div><p><b>前提：</b>${esc(p.assumptions)}</p><p><b>限制：</b>${esc(p.limitations)}</p><p><b>映射说明：</b>${esc(mp.note)}</p><p><b>身份依据：</b>${esc(p.oral_evidence)}</p>${p.acceptance_label?`<p><b>录用字段：</b>${esc(p.acceptance_label)}</p>`:''}${p.oral_status_note?`<p>${esc(p.oral_status_note)}</p>`:''}${p.method_evidence?`<p><b>方法段依据：</b>${esc(p.method_evidence)}</p>`:''}${p.falsification_experiment?`<p><b>实验建议（未执行）：</b>${esc(p.falsification_experiment)}</p>`:''}</details><div>${urlLink(p.oral_url,'官方展示来源')}　·　${urlLink(p.paper_url,'阅读论文')}</div></article>`}
function showMethod(id,hash=true){let m=methods.find(m=>m.id===id);if(!m)return;let refs=linked(m);$('dialog-label').textContent=`${m.id} / ${m.group}`;$('detail').innerHTML=`<h2>${esc(m.name)}</h2><p>${esc(m.intuition)}</p><div class="formula">${esc(m.formulation)}</div><div class="detail-grid">${[['适用问题',m.applications],['成立条件',m.assumptions],['失效边界',m.limitations],['与相邻方法的区别',m.distinction]].map(([t,v])=>`<div class="detail-box"><h3>${t}</h3><p>${esc(v)}</p></div>`).join('')}</div><p>${urlLink(m.reference_url,m.reference_title)}</p><button class="plain" data-toggle="${m.id}">${selected.has(m.id)?'移出':'加入'}对比</button><h3>关联 Oral 文献 · ${refs.length}</h3><p class="count">主要、辅助与相关联系不等同；具体关系见每篇的映射说明。</p>${refs.map(paperHTML).join('')||'<div class="notice">本轮尚未收录对应的已核 Oral。框架文献入口仍可查阅。</div>'}`;if(!$('dialog').open)$('dialog').showModal();if(hash)history.replaceState(null,'','#method='+id)}
function close(){ $('dialog').close();history.replaceState(null,'','#'+view)}
function toggle(id){if(selected.has(id))selected.delete(id);else if(selected.size<3)selected.add(id);else{alert('一次最多对比 3 个方法，请先移除一个。');return}render();if($('dialog').open)showMethod(id)}
function render(){let q=$('search').value.trim().toLowerCase();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('controls').classList.toggle('hidden',['coverage','compare'].includes(view));$('groups').classList.toggle('hidden',view!=='methods');for(let id of ['origin','evidence'])$(id).classList.toggle('hidden',view!=='methods');for(let id of ['venue','year'])$(id).classList.toggle('hidden',view!=='papers');$('comparebar').classList.toggle('hidden',!selected.size||view==='compare');$('selected-count').textContent=`已选 ${selected.size} / 3 个方法`;
const titles={methods:['为研究问题，找到数学语言。','从 59 类方法论出发，理解它为什么成立、适用于什么问题，以及顶会论文如何使用它。'],papers:['从 Oral 论文中，读出方法。','47 篇精选方法卡；46 篇官方展示已核实。每篇保留数学机制、适用边界和取证来源。'],coverage:['看清覆盖，也看清缺口。','数字是本项目精选论文数，不是大会论文总数。点击单元格，查看对应论文。'],compare:['并排比较，选对建模假设。','最多选择三个方法，比较它们解决的问题、前提与失效边界。']};$('heading').textContent=titles[view][0];$('intro').textContent=titles[view][1];
$('groups').innerHTML=groups.map((g,i)=>`<button class="group ${group===g?'active':''}" style="--c:${colors[i]}" data-group="${esc(g)}"><strong>${esc(g)}</strong><small>${methods.filter(m=>m.group===g).length} 个方法　↗</small></button>`).join('');
if(view==='methods'){let list=methods.filter(m=>(!group||m.group===group)&&(!$('origin').value||m.origin===$('origin').value)&&(!$('evidence').value||Boolean(linked(m).length)===($('evidence').value==='yes'))&&(!q||JSON.stringify(m).toLowerCase().includes(q)||linked(m).some(p=>p.title.toLowerCase().includes(q))));$('content').innerHTML=`<div class="sectionline"><b>${group||'全部方法'}</b><span class="count">显示 ${list.length} / 59　·　点击标题阅读详情</span></div><div class="grid">${list.map(m=>`<article class="card" style="--c:${color(m)}"><div class="card-head"><span>${m.id} · ${esc(m.group)}</span><span class="badge">${originNames[m.origin]}</span></div><button class="card-title" data-method="${m.id}">${esc(m.name)}</button><p>${esc(m.intuition)}</p><div class="formula">${esc(m.formulation)}</div><footer><span>${linked(m).length?linked(m).length+' 篇 Oral 关联':'框架文献入口'}</span><label class="check"><input type="checkbox" data-select="${m.id}" ${selected.has(m.id)?'checked':''}>加入对比</label></footer></article>`).join('')||'<div class="empty">没有匹配的方法。试试更宽泛的关键词，或重置筛选。</div>'}</div>`}
if(view==='papers'){let list=papers.filter(p=>(!$('venue').value||p.venue===$('venue').value)&&(!$('year').value||String(p.year)===$('year').value)&&(!q||JSON.stringify(p).toLowerCase().includes(q)));$('content').innerHTML=`<div class="sectionline"><b>论文与方法</b><span class="count">${list.length} 篇 · 3 篇定位阅读方法段，其余为摘要层筛选</span></div>`+(list.map(paperHTML).join('')||'<div class="empty">暂无匹配论文，请调整筛选。</div>')}
if(view==='coverage'){let venues=['NeurIPS','ICML','ICLR','CVPR','ICCV','ECCV'],years=[2022,2023,2024,2025,2026];$('content').innerHTML=`<div class="matrix"><table><thead><tr><th>会议</th>${years.map(y=>`<th>${y}</th>`).join('')}</tr></thead><tbody>${venues.map(v=>`<tr><th>${v}</th>${years.map(y=>{let scheduled=!(v==='ICCV'&&y%2===0||v==='ECCV'&&y%2===1),n=papers.filter(p=>p.venue===v&&p.year===y&&p.oral_status==='verified').length;return `<td>${scheduled?`<button data-cell="${v},${y}">${n}</button>`:'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="notice">24 / 25 个举办年份已有精选实例。NeurIPS 2022 仍保留缺口：本次官方数据使用 Poster / Spotlight 分类，没有将 Spotlight 自动计为 Oral。— 表示该年不举办。</div><div class="detail-grid"><div class="detail-box"><h3>两种证据分别看</h3><p>官方 Oral 身份核实，不等于全文精读。目前 43 篇为摘要层筛选，3 篇定位阅读方法段，未做实验复现。</p></div><div class="detail-box"><h3>保留来源差异</h3><p>ICML 2026 Information Flow 的展示事件为 Oral，录用字段为 spotlight。2026 记录以公开页面为准，不表示报告已举行。</p></div></div>`}
if(view==='compare'){let ms=methods.filter(m=>selected.has(m.id));$('content').innerHTML=ms.length?`<div class="chips">${ms.map(m=>`<button class="chip" data-toggle="${m.id}">移除 ${m.id} ×</button>`).join('')}<button class="chip" data-view="methods">＋ 继续选择</button></div><div class="matrix"><table class="compare-table"><thead><tr><th>比较维度</th>${ms.map(m=>`<th>${esc(m.name)}</th>`).join('')}</tr></thead><tbody>${[['intuition','核心直觉'],['formulation','数学模板'],['applications','适用问题'],['assumptions','成立条件'],['limitations','失效边界'],['distinction','相邻框架区别']].map(([key,label])=>`<tr><th>${label}</th>${ms.map(m=>`<td>${esc(m[key])}</td>`).join('')}</tr>`).join('')}<tr><th>详细卡片</th>${ms.map(m=>`<td>${methodButton(m.id)}</td>`).join('')}</tr></tbody></table></div>`:'<div class="empty">还没有选择方法。<br><button class="plain" data-view="methods">去方法卡片勾选 2–3 个 →</button></div>'}}
function setView(v){view=v;history.replaceState(null,'','#'+v);render()}
for(let v of ['NeurIPS','ICML','ICLR','CVPR','ICCV','ECCV'])$('venue').add(new Option(v,v));for(let y=2022;y<=2026;y++)$('year').add(new Option(y,y));
document.addEventListener('click',e=>{let b=e.target.closest('[data-method],[data-view],[data-group],[data-toggle],[data-cell]');if(!b)return;if(b.dataset.method)showMethod(b.dataset.method);if(b.dataset.view)setView(b.dataset.view);if(b.dataset.group){group=group===b.dataset.group?'':b.dataset.group;render()}if(b.dataset.toggle)toggle(b.dataset.toggle);if(b.dataset.cell){let[v,y]=b.dataset.cell.split(',');$('venue').value=v;$('year').value=y;$('search').value='';setView('papers')}});
document.addEventListener('change',e=>{if(e.target.dataset.select)toggle(e.target.dataset.select)});for(let id of ['search','origin','evidence','venue','year'])$(id).addEventListener(id==='search'?'input':'change',render);
$('reset').onclick=()=>{for(let id of ['search','origin','evidence','venue','year'])$(id).value='';group='';render()};$('close-dialog').onclick=close;$('dialog').addEventListener('cancel',e=>{e.preventDefault();close()});$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))close()});$('open-compare').onclick=()=>setView('compare');
function route(){let h=location.hash.slice(1);if(h.startsWith('method=')){render();showMethod(h.slice(7),false)}else{view=['methods','papers','coverage','compare'].includes(h)?h:'methods';render()}}window.addEventListener('hashchange',route);route();
</script></body></html>
